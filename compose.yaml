services:
  app:
    build: .
    ports:
      - "4321:4321"
    env_file: .env
    volumes:
      - .:/app
      # Keep the container's Linux node_modules separate from the host's,
      # otherwise native deps (e.g. resvg) built for macOS get mounted in
      - node_modules:/app/node_modules

volumes:
  node_modules:
